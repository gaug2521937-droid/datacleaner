# Render Blueprint (необязательно: сервис можно создать и через API/панель).
# Секреты не хранятся в файле: sync: false означает «спросить значение при деплое».
services:
  - type: web
    name: datacleaner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_KEY
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: DRY_RUN
        value: "1"
      - key: LLM_BASE_URL
        value: https://tokenlavka.com/v1
      - key: LLM_MODEL
        value: gpt-6-luna
      - key: LLM_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Бесплатный Render блокирует исходящий SMTP на портах 25/465/587.
      # Поэтому основной путь — HTTPS-API провайдера (Brevo: 300 писем/день бесплатно).
      # Задайте BREVO_API_KEY и EMAIL_FROM — транспорт включится сам, SMTP не нужен.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      # Вход через Google (OAuth): пользователь вводит обычный пароль Google,
      # письма идут через Gmail API по HTTPS. Пароли приложений не нужны.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
